# Database (Render environment variables, no defaults, so a missing one fails fast)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Schema: Hibernate adds missing tables and columns. Move to Flyway + validate later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server (Render sets PORT and sits behind a proxy)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# Never leak internals in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Secrets
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ORIGINS}

# No demo data in production
app.demo.seed=false

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN