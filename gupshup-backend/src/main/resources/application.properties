spring.application.name=gupshup-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/gupshup
spring.datasource.username=postgres
spring.datasource.password=vijay@30

# JPA / Hibernate: auto-create and update tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway turned off (Hibernate manages tables now)
spring.flyway.enabled=false

# Time zone
spring.jackson.time-zone=Asia/Kolkata

# Server
server.port=8080

# JWT
app.jwt.secret=gupshup-dev-secret-change-me-in-production-32chars-min
app.jwt.access-minutes=1440

app.cors.allowed-origins=http://localhost:5173

# DEV ONLY: first admin account, created on startup. Change before real use.
app.admin.email=admin@gupshup.com
app.admin.password=admin123

# Demo OTP
app.otp.demo-code=123456

app.chat.slow-mode-seconds=5

app.username.cooldown-days=5
app.legal.version=1.0