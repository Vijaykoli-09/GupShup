spring.application.name=gupshup-backend

# "local" on your laptop. The Dockerfile sets "prod" on the server.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.time-zone=Asia/Kolkata

# Business rules (not secret)
app.jwt.access-minutes=1440
app.chat.slow-mode-seconds=5
app.username.cooldown-days=5
app.legal.version=1.0

# Demo OTP. Must be replaced by a real SMS OTP before real users (see warning below).
app.otp.demo-code=123456