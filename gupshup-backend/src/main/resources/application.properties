spring.application.name=gupshup-backend

# ======================= SHARED (do not change) =======================
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.time-zone=Asia/Kolkata
spring.datasource.hikari.maximum-pool-size=5

server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.jwt.access-minutes=1440
app.chat.slow-mode-seconds=5
app.username.cooldown-days=5
app.legal.version=1.0
app.otp.demo-code=123456

# ======================= OPTION A: PRODUCTION (keep this ACTIVE when you push) =======================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ORIGINS}
app.demo.seed=false

